<svg width="1200" height="190" viewBox="0 0 1200 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gameBg" x1="0" y1="0" x2="1200" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17102B"/><stop offset=".5" stop-color="#21143C"/><stop offset="1" stop-color="#102B46"/>
    </linearGradient>
    <filter id="pixelGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#9D7BFF" opacity=".18"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="1196" height="186" rx="16" fill="url(#gameBg)" stroke="#9D7BFF" stroke-width="2"/>
  <rect x="14" y="14" width="1172" height="162" rx="10" fill="url(#dots)" stroke="#00D9FF" stroke-opacity=".35"/>

  <text x="42" y="48" fill="#FFD166" font-family="Consolas,monospace" font-size="17" font-weight="700" letter-spacing="2">B.IA SNAKE</text>
  <text x="1158" y="48" text-anchor="end" fill="#EEE9FF" font-family="Consolas,monospace" font-size="15">SCORE <tspan fill="#FF4FD8">0400</tspan></text>

  <!-- Chocolate -->
  <g transform="translate(1050 100)" filter="url(#pixelGlow)">
    <animate attributeName="opacity" values=".55;1;.55" dur="1s" repeatCount="indefinite"/>
    <rect x="-14" y="-14" width="28" height="28" rx="3" fill="#7A3E20" stroke="#FFD166" stroke-width="2"/>
    <path d="M0-14V14M-14 0H14" stroke="#D98B52" stroke-width="2"/>
  </g>

  <!-- A cobrinha percorre o tabuleiro -->
  <g filter="url(#pixelGlow)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M80 102 H970 Q1010 102 1010 72 H220 Q180 72 180 125 H930"/>
    <rect x="0" y="-9" width="22" height="18" rx="3" fill="#FFD166"/>
    <rect x="-23" y="-9" width="20" height="18" rx="3" fill="#FF4FD8"/>
    <rect x="-44" y="-9" width="18" height="18" rx="3" fill="#9D7BFF"/>
    <rect x="-63" y="-9" width="16" height="18" rx="3" fill="#00D9FF"/>
    <rect x="15" y="-4" width="4" height="4" fill="#17102B"/>
  </g>

  <text x="600" y="158" text-anchor="middle" fill="#EEE9FF" font-family="Consolas,monospace" font-size="14" letter-spacing="3">CHOCOLATE • CÓDIGO • CURIOSIDADE</text>
  <rect x="22" y="88" width="5" height="5" fill="#FF4FD8"><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></rect>
  <rect x="1168" y="126" width="5" height="5" fill="#00D9FF"><animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/></rect>
</svg>
